[project]
name = "infiniradio"
version = "0.1.0"
description = "Infinite AI radio: YuE2/ComfyUI music generation, DJ scheduling, HLS streaming"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "infiniradio contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
infiniradio = "infiniradio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infiniradio"]
