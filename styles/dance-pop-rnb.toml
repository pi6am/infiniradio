name = "dance-pop-rnb"
description = "R&B house dance pop, catchy with a strong dance beat"
enabled = true
tags = ["house", "pop", "rnb"]

[vars]
style_guide = "An R&B house dance pop rock song. Catchy and fast paced with a strong dance beat."

[weighted]
structure_guide = [
  { weight = 2, value = "" },
  { weight = 3, value = "Repetitive catchy hook. Each verse has four lines. The chorus has two lines repeated twice each." },
  { weight = 2, value = "Repetitive catchy hook. Each verse has five lines. The chorus has one strong line repeated three times." },
  { weight = 1, value = "Fast paced and punchy. Each verse has five lines with a complementary chorus that progresses each time it repeats." },
]
rhyme_guide = [
  { weight = 0, value = "Rewrite stanzas to follow an AABCDD rhyming pattern when possible. Use complex rhymes, internal rhymes are encouraged." },
  { weight = 1, value = "Don't enforce rhymes at the end of lines unless it's natural to do so, but internal rhymes are encouraged." },
]
