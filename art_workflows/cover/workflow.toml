name = "cover"
description = "Album-cover base: a concept pass, then the final image prompt (children pick the medium)"
abstract = true

[vars]
art_direction = "One strong focal idea, readable at thumbnail size, no text or lettering in the image."

[[stage]]
id = "concept"
template = "concept.j2.md"
saves = "concept"
max_attempts = 2
# Re-roll retries in a BLANK conversation: without this, the failed reply
# stays in the history and the model (especially quantized ones) re-emits
# it verbatim — temperature does not fix that. A concept is a standalone
# artifact, so nothing depends on the failed thread.
fresh_retries = true
[stage.gate]
max_chars = 4096
min_chars = 30

[[stage]]
id = "prompt"
template = "prompt.j2.md"
thread = "continue"
max_attempts = 3
feedback_template = "feedback.j2.md"
[stage.gate]
max_chars = 2048
min_chars = 60
[stage.extract]
image_prompt = [
  '(?s)```text\n(.*?)\n```',
  '(?s)```\n(.*?)\n```',
  '(?s)image prompt:\s*(.+)',
]

[output]
prompt = "image_prompt"
