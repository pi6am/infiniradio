name = "prog-anthem"
description = "prog rock anthem, heavy layered guitar and drums, complex message"
enabled = true
tags = ["rock"]

[vars]
style_guide = "A prog rock anthem. Heavy layered guitar and drums with a complex message."

[weighted]
structure_guide = [
  { weight = 2, value = "" },
  { weight = 3, value = "Fast paced and punchy. Each verse has five lines with a complementary chorus that progresses each time it repeats." },
  { weight = 2, value = "Long-form and evolving. Verses of six to eight lines with longer phrasing, a chorus that gains a line each time it appears." },
  { weight = 1, value = "Repetitive catchy hook. Short lines with six to eight lines per verse. Repetitive lyrics." },
]
rhyme_guide = [
  { weight = 0, value = "Rewrite stanzas to follow an ABABCD rhyming pattern when possible. Internal rhymes are encouraged." },
  { weight = 1, value = "Don't enforce rhymes at the end of lines unless it's natural to do so, but internal rhymes are encouraged." },
]
